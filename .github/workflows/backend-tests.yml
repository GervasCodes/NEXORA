name: Backend Tests (DB integration)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  db-tests:
    name: Backend + DB test suites
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexora_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: nexora_test
      # Intentionally unset: backend/src/config/brevo.js falls back to a
      # simulated (no-network) send outside NODE_ENV=production, so no
      # test run should ever hit a real email provider.
      # BREVO_API_KEY: (unset)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            database/package-lock.json
            frontend/package-lock.json

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot --silent && break
            sleep 2
          done

      - name: Install database deps
        run: npm ci
        working-directory: database

      - name: Run pending migrations
        run: npm run migrate
        working-directory: database

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Backend unit tests
        run: npm run test:unit
        working-directory: backend

      - name: Backend integration tests
        run: npm run test:integration
        working-directory: backend

      - name: Backend DB-integration tests
        run: npm run test:db
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend
