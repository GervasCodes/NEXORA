name: Backend Tests

# Lint + test the backend on every push/PR that touches it. This runs the
# default `npm test` suite only (tests/unit + tests/integration, both with
# the mysql2 pool mocked - see backend/jest.config.js) - it never spins up
# a real MySQL instance, so it stays fast and has no external services to
# provision. The separate real-database suite (tests/db-integration/,
# `npm run test:db`) is intentionally NOT run here; see docker-compose.test.yml
# for that suite's local-only setup.
#
# docs/SECURITY_REVIEW_CHECKLIST.md's "CI blocks merge on lint/test/audit
# failure" row and docs/UPTIME_MONITORING.md both refer to workflow names
# (ci.yml, uptime-check.yml) that don't exist yet in this repo - see the
# icon3d Phase 8 write-up for that discrepancy. This workflow (and its
# frontend counterpart) cover the lint/test half of that claim; the audit
# step and an uptime-check workflow are not part of this phase.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: Lint & Test (backend)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test
