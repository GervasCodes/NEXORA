name: CI

# Runs on every push and every PR so a broken test/lint/audit is caught
# before merge, not after deploy.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same branch/PR so pushes don't queue up
# stale CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, audit, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Backend's default `npm test` (jest.config.js) mocks the mysql2 pool
      # entirely - see tests/setupEnv.js - so no database service is needed
      # here. The separate real-database suite (test:db) is intentionally
      # NOT run in this workflow; it needs docker-compose.test.yml's MySQL
      # container and is meant for local/manual verification.
      - name: Run tests
        run: npm test

      # Reports known vulnerabilities in dependencies without failing the
      # build on low-severity/dev-only findings - moderate+ fails CI so an
      # exploitable issue in a real dependency doesn't ship silently.
      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate

  frontend:
    name: Frontend (lint, audit, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate

  database:
    name: Database package (audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: database/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (moderate and above)
        run: npm audit --audit-level=moderate
