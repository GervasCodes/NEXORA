name: CodeQL

# Static security analysis. Runs on every push/PR to catch new findings
# before merge, plus a weekly scheduled scan so findings surface even on
# weeks with no commits (new CodeQL query packs, newly-disclosed patterns).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # javascript-typescript's default build covers both backend
      # (CommonJS/Node) and frontend (JSX/Vite) source - no separate
      # compile step is required for CodeQL's JS/TS analysis.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
