name: CodeQL

# Static application security testing (SAST) over the whole repo's
# JavaScript/JSX (backend + frontend both use the same "javascript"
# CodeQL language pack; no per-package matrix needed). Referenced from
# docs/SECURITY_REVIEW_CHECKLIST.md's SAST row, which already assumed
# this workflow existed under this path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of push/PR activity, to catch newly-published
    # CodeQL query updates against unchanged code.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
