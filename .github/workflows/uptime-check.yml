name: Uptime Check

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        id: ping
        run: |
          URL="${{ vars.BACKEND_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_HEALTH_URL repository variable is not set - skipping check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Health check returned HTTP $STATUS"

      - name: Open or update issue on failure
        if: steps.ping.outputs.skip == 'false' && steps.ping.outputs.status != '200'
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.ping.outputs.status }}";
            const label = "uptime";
            const title = "Backend health check failing";
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const body = `Health check returned HTTP ${status} at ${new Date().toISOString()}.`;
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
            }

      - name: Auto-close issue on recovery
        if: steps.ping.outputs.skip == 'false' && steps.ping.outputs.status == '200'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "uptime";
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Health check recovered (HTTP 200) at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
