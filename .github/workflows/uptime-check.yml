name: Uptime Check

# Lightweight, zero-cost backup to whatever external uptime monitor is
# configured (see docs/UPTIME_MONITORING.md) - pings the deployed
# backend's /health endpoint on a schedule and files a GitHub issue if it
# stops responding with 200, so an outage still surfaces even if the
# external monitor's alerting is misconfigured or its free tier lapses.
on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: {} # allow manual "run now" from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Ensure health check URL is configured
        id: url
        run: |
          if [ -z "${{ vars.BACKEND_HEALTH_URL }}" ]; then
            echo "::warning::vars.BACKEND_HEALTH_URL is not set (repo Settings > Secrets and variables > Actions > Variables). Skipping this run - see docs/UPTIME_MONITORING.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check health endpoint
        if: steps.url.outputs.configured == 'true'
        id: ping
        run: |
          status=$(curl -s -o /tmp/health_body.json -w "%{http_code}" --max-time 15 "${{ vars.BACKEND_HEALTH_URL }}" || echo "000")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Response ($status):"
          cat /tmp/health_body.json 2>/dev/null || true

      - name: Open issue on failure
        if: steps.url.outputs.configured == 'true' && steps.ping.outputs.status != '200'
        uses: actions/github-script@v9
        with:
          script: |
            const status = "${{ steps.ping.outputs.status }}";
            const title = "🔴 Backend health check failing";
            const body = `The scheduled uptime check got HTTP \`${status}\` from the backend's \`/health\` endpoint (expected \`200\`).\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["uptime", "bug"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing: HTTP \`${status}\`.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

      - name: Auto-close resolved uptime issues
        if: steps.url.outputs.configured == 'true' && steps.ping.outputs.status == '200'
        uses: actions/github-script@v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Health check is passing again (HTTP 200). Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
