openapi: 3.0.3
info:
  title: NEXORA API
  version: 1.0.0
  description: 'REST API for the NEXORA multi-vendor marketplace (products + services/booking). Paths are relative to the server URL, which already ends in /api/v1. The operations were first generated from the Express route definitions and validators in backend/src/modules/*; the list of operations is kept in step with the code by backend/scripts/syncOpenApi.js (checked by tests/unit/docs/openapiDrift.test.js). Operations marked x-contract-documented: false are stubs: the route, its guards and its path parameters are real, but the request and response contract is not written yet - read the module''s *.validator.js and *.controller.js. Modules without HTTP routes (audit, fraud, otp, refund) are documented in docs/technical/architecture.md.'
  contact:
    name: NEXORA Engineering
servers:
  - url: https://api.nexoramarketplace.online/api/v1
    description: Production (domain as referenced in docs/FRONTEND_CSP.md - confirm before publishing this spec)
  - url: http://localhost:5000/api/v1
    description: Local development
tags:
  - name: account
    description: Signed-in user's own profile, settings, and password/account-deletion flows.
  - name: accountVerification
    description: Admin review queue for seller identity/business verification submissions.
  - name: admin
    description: Admin-only dashboard, analytics, moderation, and platform-control endpoints. Gated on the `admin` role for the whole router.
  - name: adminNotification
    description: Admin-facing notification feed, separate from the per-user `notification` module.
  - name: ai
    description: 'Nexora AI: buyer-facing chat/search/recommend assistant (B1), seller draft-generation (B2), and admin copilot (B3) - all advisory, spend-guarded, and gated by an admin master switch.'
  - name: auth
    description: 'Registration, password login (always two steps: password, then a one-time code sent by email, verified at /auth/login/verify-otp; no session exists until the code is verified), and password reset. Public (no auth required).'
  - name: availability
    description: Per-date bookable capacity/price overrides for a service, feeding the booking engine.
  - name: booking
    description: The services-side equivalent of `order` - creation, provider confirm/reject, cancel, lookup.
  - name: cart
    description: Buyer's shopping cart for product purchases.
  - name: category
    description: Product category/department taxonomy, including department maintenance-mode toggles.
  - name: chat
    description: Buyer/seller/delivery-agent messaging - conversations, messages, reactions, read receipts.
  - name: delivery
    description: Delivery agent assignment, offer dispatch, live tracking, and buyer delivery confirmation.
  - name: departmentSponsorship
    description: Paid department-level sponsorship placement campaigns.
  - name: dispute
    description: Buyer/seller dispute filing and evidence upload, with admin resolution in `admin`.
  - name: earnings
    description: Delivery agent earnings ledger (per-delivery payouts).
  - name: featuredStore
    description: Paid featured-store placement campaigns.
  - name: maintenance
    description: Admin toggles for department/service-category maintenance windows (immediate and scheduled).
  - name: notification
    description: Per-user notification feed (in-app + push fan-out).
  - name: order
    description: Product-side order lifecycle - checkout, multi-vendor splitting, buyer/seller views, receipt confirmation.
  - name: payment
    description: Payment initiation/checkout across all providers (MalipoPay, Selcom, Snippe, PayPal) and their webhooks, for both orders and bookings, plus the seller verification fee.
  - name: product
    description: Seller product listings - CRUD, media, activation, search/filter metadata.
  - name: push
    description: Web Push subscription registration, used by `notification`/`delivery`/`adminNotification`.
  - name: recommendation
    description: Buyer-facing "related/recommended products" surface.
  - name: review
    description: Product and booking reviews, with seller replies and photo attachments.
  - name: seller
    description: Seller/provider profile - branding, verification status, collections, merchant type.
  - name: service
    description: Service-provider bookable listings (the services-side equivalent of `product`).
  - name: serviceCategory
    description: Service taxonomy (Accommodation, Transportation, Tourism, ...), analogous to `category`.
  - name: settings
    description: Key/value platform settings (`platform_settings` EAV table), including the monetization master switch.
  - name: sponsorship
    description: Paid product sponsorship campaigns.
  - name: status
    description: Public status-page/incident feed.
  - name: store
    description: Public storefront view of a seller (product side).
  - name: storeType
    description: Store type taxonomy sellers select from at signup.
  - name: subscription
    description: Seller subscription plans and the commission rate they unlock.
  - name: wallet
    description: Seller/provider wallet balance, withdrawals, and escrow crediting - the shared money layer for both products and services.
  - name: wishlist
    description: Buyer's saved-for-later product list.
  - name: Seller stock
    description: Seller stock endpoints (tag added by scripts/syncOpenApi.js).
  - name: affiliate
    description: affiliate endpoints (tag added by scripts/syncOpenApi.js).
  - name: app
    description: app endpoints (tag added by scripts/syncOpenApi.js).
  - name: broadcast
    description: broadcast endpoints (tag added by scripts/syncOpenApi.js).
  - name: business
    description: business endpoints (tag added by scripts/syncOpenApi.js).
  - name: businessTools
    description: businessTools endpoints (tag added by scripts/syncOpenApi.js).
  - name: buyerAddress
    description: buyerAddress endpoints (tag added by scripts/syncOpenApi.js).
  - name: buyerWallet
    description: buyerWallet endpoints (tag added by scripts/syncOpenApi.js).
  - name: content
    description: content endpoints (tag added by scripts/syncOpenApi.js).
  - name: coupon
    description: coupon endpoints (tag added by scripts/syncOpenApi.js).
  - name: dataReset
    description: dataReset endpoints (tag added by scripts/syncOpenApi.js).
  - name: deliveryBusiness
    description: deliveryBusiness endpoints (tag added by scripts/syncOpenApi.js).
  - name: documentAccess
    description: documentAccess endpoints (tag added by scripts/syncOpenApi.js).
  - name: efd
    description: efd endpoints (tag added by scripts/syncOpenApi.js).
  - name: groupBuy
    description: groupBuy endpoints (tag added by scripts/syncOpenApi.js).
  - name: kyc
    description: kyc endpoints (tag added by scripts/syncOpenApi.js).
  - name: liveSelling
    description: liveSelling endpoints (tag added by scripts/syncOpenApi.js).
  - name: pickupPoint
    description: pickupPoint endpoints (tag added by scripts/syncOpenApi.js).
  - name: pos
    description: pos endpoints (tag added by scripts/syncOpenApi.js).
  - name: productAlert
    description: productAlert endpoints (tag added by scripts/syncOpenApi.js).
  - name: productQuestion
    description: productQuestion endpoints (tag added by scripts/syncOpenApi.js).
  - name: productVariant
    description: productVariant endpoints (tag added by scripts/syncOpenApi.js).
  - name: referral
    description: referral endpoints (tag added by scripts/syncOpenApi.js).
  - name: refund
    description: refund endpoints (tag added by scripts/syncOpenApi.js).
  - name: return
    description: return endpoints (tag added by scripts/syncOpenApi.js).
  - name: search
    description: search endpoints (tag added by scripts/syncOpenApi.js).
  - name: sellerSavedFilter
    description: sellerSavedFilter endpoints (tag added by scripts/syncOpenApi.js).
  - name: seoMetrics
    description: seoMetrics endpoints (tag added by scripts/syncOpenApi.js).
  - name: sms
    description: sms endpoints (tag added by scripts/syncOpenApi.js).
  - name: stock
    description: stock endpoints (tag added by scripts/syncOpenApi.js).
  - name: support
    description: support endpoints (tag added by scripts/syncOpenApi.js).
  - name: whatsapp
    description: whatsapp endpoints (tag added by scripts/syncOpenApi.js).
