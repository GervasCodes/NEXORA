components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Session token issued on login/OTP verification. Sent as `Authorization: Bearer <token>`.'
  schemas:
    ApiResponse:
      type: object
      description: 'Every NEXORA endpoint responds with this envelope shape (see any `*.controller.js`): `success` always present, `data`/`message` vary by endpoint.'
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Endpoint-specific payload - see the corresponding controller/service for its exact shape.
          nullable: true
      required:
        - success
