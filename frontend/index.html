<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="NEXORA — a regional multi-vendor marketplace connecting buyers, sellers, and delivery partners." />
    <meta name="theme-color" content="#070912" />
    <!--
      Phase 5 (Resilience & Growth): these five href/src values used to be
      relative ("public/manifest.json", "public/icon-180.png", "src/main.jsx").
      That resolves fine for the root URL, but this is a client-routed SPA
      (BrowserRouter) - a deep link or a hard refresh on any non-root route
      (e.g. /product/123) makes the browser resolve a relative href against
      THAT path, producing /product/123/public/manifest.json - a 404, and
      on some hosts a silent fallback to the SPA's own catch-all HTML
      response for manifest.json, which is worse: a browser trying to
      parse index.html itself as a JSON manifest. Absolute (leading "/")
      paths resolve the same from any route.
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!--
      iOS/iPadOS ignores the Web App Manifest's `display: standalone` -
      Safari only respects its own apple-* meta tags for "Add to Home
      Screen" behavior. Without these, a NEXORA icon added to an iPhone
      home screen just opens Safari with browser chrome around it instead
      of a standalone app window.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXORA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>NEXORA — Marketplace</title>
    <!--
      Phase 5 (Visual Polish & Metadata): static site-default Open Graph /
      Twitter Card tags. PageMeta.jsx already injects these per-page via
      react-helmet-async, but that only reaches crawlers that execute
      JS - link-preview bots (WhatsApp, Facebook, Telegram, LinkedIn,
      Twitter/X) generally fetch the raw HTML and don't run React, so
      without a static fallback here they see no og:image at all. These
      tags are the site-wide default; PageMeta's per-page <meta> tags
      (same property names) take precedence for any crawler that does
      render JS, since they're appended after this static markup in the
      document. Same "no dedicated 1200x630 OG banner in the repo yet"
      caveat as PageMeta.jsx - icon-512.png is a reasonable, honest
      fallback rather than a fabricated marketing image; swap both this
      and PageMeta's DEFAULT_IMAGE once a proper banner exists.
    -->
    <meta property="og:site_name" content="NEXORA" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NEXORA — Marketplace" />
    <meta property="og:description" content="NEXORA — a regional multi-vendor marketplace connecting buyers, sellers, and delivery partners." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NEXORA — Marketplace" />
    <meta name="twitter:description" content="NEXORA — a regional multi-vendor marketplace connecting buyers, sellers, and delivery partners." />
    <meta name="twitter:image" content="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    />
</head>
<body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
