<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Shop products from local sellers and book services on NEXORA, a regional multi-vendor marketplace with delivery tracked door to door." data-rh="true" />
    <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070912" media="(prefers-color-scheme: dark)" />
    <!--
      (Resilience & Growth): these five href/src values used to be
      relative ("public/manifest.json", "public/icon-180.png", "src/main.jsx").
      That resolves fine for the root URL, but this is a client-routed SPA
      (BrowserRouter) - a deep link or a hard refresh on any non-root route
      (e.g. /product/123) makes the browser resolve a relative href against
      THAT path, producing /product/123/public/manifest.json - a 404, and
      on some hosts a silent fallback to the SPA's own catch-all HTML
      response for manifest.json, which is worse: a browser trying to
      parse index.html itself as a JSON manifest. Absolute (leading "/")
      paths resolve the same from any route.
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!--
      iOS/iPadOS ignores the Web App Manifest's `display: standalone` -
      Safari only respects its own apple-* meta tags for "Add to Home
      Screen" behavior. Without these, a NEXORA icon added to an iPhone
      home screen just opens Safari with browser chrome around it instead
      of a standalone app window.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXORA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>NEXORA — Shop Local Products &amp; Book Services</title>
    <!--
      (Branding): dedicated 1200x630 Open Graph banner
      (og-banner.png) - replaces the icon-512.png fallback used while no
      banner existed. PageMeta.jsx already injects these per-page via
      react-helmet-async, but that only reaches crawlers that execute
      JS - link-preview bots (WhatsApp, Facebook, Telegram, LinkedIn,
      Twitter/X) generally fetch the raw HTML and don't run React, so
      without a static fallback here they see no og:image at all. These
      tags are the site-wide default; PageMeta's per-page <meta> tags
      (same property names) take precedence for any crawler that does
      render JS, since they're appended after this static markup in the
      document.
    -->
    <meta property="og:site_name" content="NEXORA" data-rh="true" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:title" content="NEXORA  Shop Local Products &amp; Book Services" data-rh="true" />
    <meta property="og:description" content="Shop products from local sellers and book services on NEXORA, a regional multi-vendor marketplace with delivery tracked door to door." data-rh="true" />
    <meta property="og:image" content="https://nexoramarketplace.online/og-banner.png" data-rh="true" />
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:title" content="NEXORA  Shop Local Products &amp; Book Services" data-rh="true" />
    <meta name="twitter:description" content="Shop products from local sellers and book services on NEXORA, a regional multi-vendor marketplace with delivery tracked door to door." data-rh="true" />
    <meta name="twitter:image" content="https://nexoramarketplace.online/og-banner.png" data-rh="true" />
    <!--
      Site-wide Organization structured data. Static (not per-page) because
      it describes NEXORA itself and must be present before any JS runs.
      All URLs are absolute (schema.org consumers don't resolve relative
      ones), and @id lets the homepage's WebSite markup (see Home.jsx)
      reference this same entity as its publisher. sameAs lists only the
      official profiles already linked from the site footer.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://nexoramarketplace.online/#organization",
        "name": "NEXORA",
        "url": "https://nexoramarketplace.online/",
        "logo": "https://nexoramarketplace.online/icon-512.png",
        "description": "NEXORA is a regional multi-vendor marketplace connecting buyers, sellers, and delivery partners.",
        "sameAs": [
          "https://www.instagram.com/nexora.marketplace",
          "https://www.tiktok.com/@nexoramarketplace4",
          "https://www.youtube.com/@Nexoramarketplace"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Every product/service/store image is served from here - preconnecting
         saves the DNS+TLS handshake on the very first image request instead
         of paying it mid-render. (The API origin is env-configured per
         deployment, so it can't be preconnected from this static file.) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    />
</head>
<body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <noscript>
        <h1>NEXORA</h1>
        <p>A regional multi-vendor marketplace connecting buyers, sellers, and delivery partners. NEXORA needs JavaScript enabled to run.</p>
        <nav aria-label="Explore NEXORA">
            <a href="/products">Shop all products</a> ·
            <a href="/services">Book services</a> ·
            <a href="/guides">Buying guides</a> ·
            <a href="/group-buys">Group buys</a> ·
            <a href="/live-selling">Live selling</a> ·
            <a href="/legal/company-information">Company information</a>
        </nav>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
